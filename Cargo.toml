[package]
name = "jrg"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Intent-aware ripgrep results, reranked with Jev"
license = "MIT"
repository = "https://github.com/sukobuto/jrg"
readme = "README.md"
keywords = ["search", "ripgrep", "cli", "ai", "reranking"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/*.rs", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", ".jrgenv.example"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
