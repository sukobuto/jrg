[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jrg"
version = "0.1.0"
description = "Intent-aware ripgrep results, reranked with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jrg = "jrg.cli:main"

[tool.setuptools]
packages = ["jrg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
